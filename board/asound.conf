# FastCarPlay -- F1C200s ALSA setup.
#
# The app's AudioMixer owns hw:0,0 DIRECTLY (blocking snd_pcm I/O): it mixes
# the media and voice streams in software (integer resampler + Q15 duck) and
# the mic uplink captures hw:0,0 the same way. The former dmix/plug chain is
# gone -- its per-period plugin work and the SDL pump threads on top of it
# were the main CPU cost of a call on this single core.
#
# `default` below is only for OTHER clients: the Android Auto recorder's SDL
# capture and ad-hoc test tools. It is a plain plug over the codec; while the
# app is playing, hw:0,0 playback is busy (expected -- the app is the mixer).

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
