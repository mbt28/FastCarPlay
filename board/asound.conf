# FastCarPlay -- software mixing for the single F1C200s audio codec.
#
# The F1C codec has ONE playback stream and alsa-lib's default device has no
# mixer, so the music (main, type 102) and voice (aux, type 100/101) PcmAudio
# streams used to fight for the device: one opened, the other got EBUSY, and the
# app worked around it by closing the device on every idle gap -- which reopened
# the codec on nearly every burst of a live call and chopped telephony/Siri.
#
# dmix mixes the two streams in software onto one hardware playback stream, so
# both can stay open at once (no EBUSY, no close/reopen churn). The mix rate is
# 48000, the cleanest common rate here: OPUS voice already decodes to 48k (no
# resample), PCM voice (16k/24k) upsamples to 48k by an exact integer factor
# (x3 / x2, cheap), and the media (AAC) is advertised as 48k too so music is not
# resampled either. 44100 would instead force fractional resampling on all of
# them.
#
# A `plug` sits in front of dmix: dmix itself does NO conversion, so without it
# a sink that opens at 24k mono (PCM voice) would make SDL resample in FLOAT on
# this FPU-less core. The plug lets each sink open at its native rate and does
# the rate/channel/format conversion with ALSA's integer linear converter; the
# 48k-stereo streams (48k AAC music, OPUS voice decoded to 48k) pass straight
# through at no cost.
#
# Capture (the mic uplink) is kept on a plain hw path via `asym`, since dmix is
# playback-only; the codec is full-duplex (Siri proved simultaneous TTS+mic).
#
# Deploy to /etc/asound.conf on the target. NOTE for test playback: while the
# app holds the dmix, opening hw:0,0 directly (e.g. aplay/speaker-test -D hw:0,0)
# gets EBUSY -- route test tones through `-D default` so they mix via dmix too.

pcm.!default {
    type asym
    playback.pcm "fcp_play"
    capture.pcm "fcp_cap"
}

pcm.fcp_play {
    type plug
    slave.pcm "fcp_dmix"
}

pcm.fcp_dmix {
    type dmix
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 4096
    }
}

pcm.fcp_cap {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
